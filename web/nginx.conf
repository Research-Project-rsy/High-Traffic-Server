worker_processes auto;

events {
  # worker_connections 1024;
  worker_connections 4096;  # 한 worker가 처리할 수 있는 최대 connection 수
  multi_accept on;          # 한 번에 가능한 연결 모두 수락
}

http {
  upstream was_upstream {

    server was-1:8080 max_fails=3 fail_timeout=5s;
    server was-2:8080 max_fails=3 fail_timeout=5s;
    server was-3:8080 max_fails=3 fail_timeout=5s;
    server was-4:8080 max_fails=3 fail_timeout=5s;
    server was-5:8080 max_fails=3 fail_timeout=5s;
    keepalive 128;

  }

  server {
    listen 80;
    location / {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_pass http://was_upstream;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 1s;    # WAS 연결 대기 시간
      proxy_send_timeout 30s;      # 요청 전송 타임아웃
      proxy_read_timeout 30s;      # 응답 수신 타임아웃

    }
  }
}



